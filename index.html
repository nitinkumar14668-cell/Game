<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast </title>
    <style>
        :root {
            --bg-color: #0f111a;
            --board-bg: #1e2233;
            --cell-empty: #2a2e40;
            --text-color: #ffffff;
            --cell-size: 40px;
            --gap: 3px;
        }

        * {
            box-sizing: border-box;
            touch-action: none; /* Prevent default touch actions like pull-to-refresh */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Prevent scrolling */
            overscroll-behavior: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 450px;
            padding: 20px 20px 10px 20px;
            font-size: 28px;
            font-weight: 800;
        }

        .score-box {
            font-size: 22px;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
        }

        .board-wrapper {
            background-color: var(--board-bg);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, var(--cell-size));
            grid-template-rows: repeat(8, var(--cell-size));
            gap: var(--gap);
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--cell-empty);
            border-radius: 6px;
            transition: background-color 0.15s, transform 0.2s;
        }

        .cell.filled {
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.3), inset -2px -2px 5px rgba(0,0,0,0.3);
        }

        .cell.highlight {
            background-color: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.5);
        }

        .cell.clearing {
            animation: clearAnim 0.3s forwards;
        }

        @keyframes clearAnim {
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        .tray {
            display: flex;
            justify-content: space-evenly;
            gap: 15px;
            width: 100%;
            max-width: 450px;
            height: 140px;
            align-items: center;
            padding: 0 10px;
        }

        .tray-slot {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shape-container {
            display: grid;
            gap: var(--gap);
        }

        .shape-container.draggable {
            cursor: grab;
        }

        .shape-container.draggable:active {
            cursor: grabbing;
        }

        /* Scaled down shape in tray */
        .shape-cell {
            width: calc(var(--cell-size) * 0.55);
            height: calc(var(--cell-size) * 0.55);
            border-radius: 4px;
        }

        .shape-filled {
            box-shadow: inset 2px 2px 4px rgba(255,255,255,0.4), inset -2px -2px 4px rgba(0,0,0,0.3);
        }

        .shape-cell.empty {
            background-color: transparent;
            box-shadow: none;
        }

        /* Dragging state */
        .dragging {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            top: 0; 
            left: 0;
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.6));
        }

        /* When dragging, blocks should look exactly like board blocks */
        .dragging .shape-cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border-radius: 6px;
        }

        /* Game Over Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }

        .modal.hidden {
            display: none;
        }

        .modal h2 {
            font-size: 46px;
            margin: 0 0 10px 0;
            color: #ff3366;
            text-shadow: 0 4px 10px rgba(255, 51, 102, 0.5);
        }

        .modal p {
            font-size: 24px;
            margin: 0 0 40px 0;
            color: #ccc;
        }

        .modal p span {
            color: #fff;
            font-weight: bold;
        }

        .modal button {
            padding: 16px 48px;
            font-size: 22px;
            background: linear-gradient(135deg, #3399ff, #0066cc);
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(51, 153, 255, 0.5);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .modal button:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(51, 153, 255, 0.4);
        }

        /* Mobile responsiveness */
        @media (max-width: 450px) {
            :root {
                --cell-size: calc((100vw - 40px) / 8 - var(--gap));
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div>Blast 2D</div>
        <div class="score-box">Score: <span id="score">0</span></div>
    </div>

    <div class="board-wrapper">
        <div class="board" id="board"></div>
    </div>

    <div class="tray" id="tray"></div>

    <div class="modal hidden" id="gameOverModal">
        <h2>Out of Moves!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="startGame()">Play Again</button>
    </div>

    <script>
        const SHAPES = [
            { matrix: [[1]], color: '#ff3366' }, // 1x1
            { matrix: [[1, 1]], color: '#ff9933' }, // 1x2 H
            { matrix: [[1], [1]], color: '#ff9933' }, // 1x2 V
            { matrix: [[1, 1, 1]], color: '#33cc33' }, // 1x3 H
            { matrix: [[1], [1], [1]], color: '#33cc33' }, // 1x3 V
            { matrix: [[1, 1, 1, 1]], color: '#3399ff' }, // 1x4 H
            { matrix: [[1], [1], [1], [1]], color: '#3399ff' }, // 1x4 V
            { matrix: [[1, 1, 1, 1, 1]], color: '#cc33ff' }, // 1x5 H
            { matrix: [[1], [1], [1], [1], [1]], color: '#cc33ff' }, // 1x5 V
            { matrix: [[1, 1], [1, 1]], color: '#ffcc00' }, // 2x2
            { matrix: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: '#f03e3e' }, // 3x3
            { matrix: [[1, 0], [1, 1]], color: '#00ffff' }, // small L
            { matrix: [[0, 1], [1, 1]], color: '#00ffff' },
            { matrix: [[1, 1], [1, 0]], color: '#00ffff' },
            { matrix: [[1, 1], [0, 1]], color: '#00ffff' },
            { matrix: [[1, 0, 0], [1, 0, 0], [1, 1, 1]], color: '#ff99cc' }, // big L
            { matrix: [[0, 0, 1], [0, 0, 1], [1, 1, 1]], color: '#ff99cc' },
            { matrix: [[1, 1, 1], [1, 0, 0], [1, 0, 0]], color: '#ff99cc' },
            { matrix: [[1, 1, 1], [0, 0, 1], [0, 0, 1]], color: '#ff99cc' }
        ];

        let board = [];
        let boardCells = [];
        let trayPieces = [];
        let score = 0;
        
        let isDragging = false;
        let activePiece = null;
        let activePieceData = null;
        let clone = null;
        let hoverRow = -1;
        let hoverCol = -1;

        const boardEl = document.getElementById('board');
        const trayEl = document.getElementById('tray');
        const scoreEl = document.getElementById('score');
        const modal = document.getElementById('gameOverModal');
        const finalScoreEl = document.getElementById('finalScore');

        function initBoard() {
            boardEl.innerHTML = '';
            boardCells = [];
            board = Array(8).fill().map(() => Array(8).fill(null));
            for(let i=0; i<64; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                boardEl.appendChild(cell);
                boardCells.push(cell);
            }
        }

        function createShapeElement(shape, isTray = true) {
            const el = document.createElement('div');
            el.className = 'shape-container' + (isTray ? ' draggable' : '');
            el.style.gridTemplateColumns = `repeat(${shape.matrix[0].length}, 1fr)`;
            
            for(let r=0; r<shape.matrix.length; r++) {
                for(let c=0; c<shape.matrix[r].length; c++) {
                    const block = document.createElement('div');
                    block.className = 'shape-cell' + (shape.matrix[r][c] ? ' shape-filled' : ' empty');
                    if(shape.matrix[r][c]) {
                        block.style.backgroundColor = shape.color;
                    }
                    el.appendChild(block);
                }
            }
            return el;
        }

        function generateTray() {
            trayEl.innerHTML = '';
            trayPieces = [];
            for(let i=0; i<3; i++) {
                const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                trayPieces.push({ ...shape, used: false, index: i });
                
                const slot = document.createElement('div');
                slot.className = 'tray-slot';
                
                const shapeEl = createShapeElement(shape);
                shapeEl.dataset.index = i;
                
                // Mouse/Touch Events
                shapeEl.addEventListener('pointerdown', handlePointerDown);
                
                slot.appendChild(shapeEl);
                trayEl.appendChild(slot);
            }
            checkGameOver();
        }

        function handlePointerDown(e) {
            if(isDragging) return;
            const target = e.currentTarget;
            const index = target.dataset.index;
            if(trayPieces[index].used) return;

            isDragging = true;
            activePiece = target;
            activePieceData = trayPieces[index];
            
            // Hide original in tray
            activePiece.style.opacity = '0';
            
            // Create visually large clone for dragging
            clone = createShapeElement(activePieceData, false);
            clone.className = 'shape-container dragging';
            document.body.appendChild(clone);
            
            updateClonePosition(e.clientX, e.clientY);
            updateHoverState(e.clientX, e.clientY);
            
            document.addEventListener('pointermove', handlePointerMove);
            document.addEventListener('pointerup', handlePointerUp);
        }

        function updateClonePosition(x, y) {
            if(!clone) return;
            // Lift the piece above the finger smoothly using transform
            // translate(-50%, -100%) ensures the center-bottom of the piece is near the pointer
            clone.style.transform = `translate(${x}px, ${y - 30}px) translate(-50%, -100%) scale(1.0)`;
        }

        function updateHoverState(clientX, clientY) {
            clearHighlight();
            if(!clone || !activePieceData) return;
            
            const boardRect = boardEl.getBoundingClientRect();
            const cloneRect = clone.getBoundingClientRect();
            
            // Calculate actual cell size on screen
            const cellSize = boardRect.width / 8;
            
            // Position of clone relative to board
            const relX = cloneRect.left - boardRect.left;
            const relY = cloneRect.top - boardRect.top;
            
            // Allow snapping when halfway across a cell
            const col = Math.round(relX / cellSize);
            const row = Math.round(relY / cellSize);

            if(isValidPlacement(activePieceData.matrix, row, col)) {
                hoverRow = row;
                hoverCol = col;
                highlightCells(activePieceData.matrix, row, col);
            } else {
                hoverRow = -1;
                hoverCol = -1;
            }
        }

        function handlePointerMove(e) {
            if(!isDragging) return;
            updateClonePosition(e.clientX, e.clientY);
            updateHoverState(e.clientX, e.clientY);
        }

        function handlePointerUp(e) {
            if(!isDragging) return;
            isDragging = false;
            document.removeEventListener('pointermove', handlePointerMove);
            document.removeEventListener('pointerup', handlePointerUp);
            
            if(hoverRow !== -1 && hoverCol !== -1) {
                placePiece(activePieceData, hoverRow, hoverCol);
            } else {
                // Invalid drop, return to tray
                activePiece.style.opacity = '1';
            }
            
            if(clone) {
                clone.remove();
                clone = null;
            }
            clearHighlight();
            activePiece = null;
            activePieceData = null;
        }

        function isValidPlacement(matrix, r, c) {
            for(let i=0; i<matrix.length; i++) {
                for(let j=0; j<matrix[i].length; j++) {
                    if(matrix[i][j]) {
                        let br = r + i;
                        let bc = c + j;
                        // Check bounds
                        if(br < 0 || br >= 8 || bc < 0 || bc >= 8) return false;
                        // Check collision
                        if(board[br][bc] !== null) return false;
                    }
                }
            }
            return true;
        }

        function highlightCells(matrix, r, c) {
            for(let i=0; i<matrix.length; i++) {
                for(let j=0; j<matrix[i].length; j++) {
                    if(matrix[i][j]) {
                        boardCells[(r+i)*8 + (c+j)].classList.add('highlight');
                    }
                }
            }
        }

        function clearHighlight() {
            boardCells.forEach(cell => cell.classList.remove('highlight'));
        }

        function placePiece(data, r, c) {
            let blocksPlaced = 0;
            // 1. Visually and Logically lock the piece on the board
            for(let i=0; i<data.matrix.length; i++) {
                for(let j=0; j<data.matrix[i].length; j++) {
                    if(data.matrix[i][j]) {
                        board[r+i][c+j] = data.color;
                        let cell = boardCells[(r+i)*8 + (c+j)];
                        cell.style.backgroundColor = data.color;
                        cell.classList.add('filled');
                        blocksPlaced++;
                    }
                }
            }
            
            score += blocksPlaced;
            updateScore();
            
            // Mark as used in tray
            activePiece.style.visibility = 'hidden';
            trayPieces[data.index].used = true;
            
            // 2. Clear any completed rows/columns
            checkClear();
            
            // 3. Replenish tray or check Game Over
            if(trayPieces.every(p => p.used)) {
                generateTray();
            } else {
                checkGameOver();
            }
        }

        function checkClear() {
            let rowsToClear = [];
            let colsToClear = [];
            
            // Find full rows
            for(let i=0; i<8; i++) {
                let rowFull = true;
                for(let j=0; j<8; j++) {
                    if(!board[i][j]) rowFull = false;
                }
                if(rowFull) rowsToClear.push(i);
            }
            
            // Find full cols
            for(let j=0; j<8; j++) {
                let colFull = true;
                for(let i=0; i<8; i++) {
                    if(!board[i][j]) colFull = false;
                }
                if(colFull) colsToClear.push(j);
            }
            
            let cellsToClear = new Set();
            rowsToClear.forEach(r => {
                for(let j=0; j<8; j++) cellsToClear.add(`${r},${j}`);
            });
            colsToClear.forEach(c => {
                for(let i=0; i<8; i++) cellsToClear.add(`${i},${c}`);
            });
            
            if(cellsToClear.size > 0) {
                // Combo bonus scoring
                let linesCleared = rowsToClear.length + colsToClear.length;
                score += cellsToClear.size * 2 + (linesCleared > 1 ? linesCleared * 10 : 0);
                updateScore();
                
                cellsToClear.forEach(pos => {
                    let [r, c] = pos.split(',').map(Number);
                    // Clear logical board instantly so game over check works synchronously later
                    board[r][c] = null; 
                    
                    // Animate visual clearing
                    let idx = r*8 + c;
                    let cell = boardCells[idx];
                    cell.classList.add('clearing');
                    
                    // Reset cell visual after animation 
                    setTimeout(() => {
                        cell.style.backgroundColor = 'var(--cell-empty)';
                        cell.classList.remove('filled', 'clearing');
                    }, 300);
                });
            }
        }

        function checkGameOver() {
            let canPlay = false;
            for(let p of trayPieces) {
                if(p.used) continue;
                for(let r=0; r<8; r++) {
                    for(let c=0; c<8; c++) {
                        if(isValidPlacement(p.matrix, r, c)) {
                            canPlay = true;
                            break;
                        }
                    }
                    if(canPlay) break;
                }
                if(canPlay) break;
            }
            
            if(!canPlay && !trayPieces.every(p => p.used)) {
                finalScoreEl.innerText = score;
                modal.classList.remove('hidden');
            }
        }

        function updateScore() {
            scoreEl.innerText = score;
        }

        function startGame() {
            modal.classList.add('hidden');
            score = 0;
            updateScore();
            initBoard();
            generateTray();
        }

        // Boot
        startGame();
    </script>
</body>
</html>
